<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14949B"/>
      <stop offset="100%" stop-color="#0E5E6F"/>
    </linearGradient>
    <pattern id="orthoGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.5"/>
    </pattern>
  </defs>
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="120" fill="url(#gridGrad)"/>
  <rect width="512" height="512" rx="120" fill="url(#orthoGrid)"/>
  
  <!-- Tooth Outline with Brackets -->
  <g transform="translate(64, 48) scale(0.75)" stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tooth Crown and Roots -->
    <path d="M120 100 C120 40, 180 40, 256 70 C332 40, 392 40, 392 100 C392 180, 430 240, 392 440 C360 440, 320 340, 256 260 C192 340, 152 440, 120 440 C82 240, 120 180, 120 100 Z" 
          stroke-width="26" fill="rgba(255,255,255,0.04)"/>
    
    <!-- Archwire -->
    <path d="M80 180 L432 180" stroke-width="16" stroke-dasharray="0"/>
    
    <!-- Orthodontic Brackets -->
    <rect x="140" y="150" width="40" height="60" rx="6" fill="#FFFFFF" stroke="none"/>
    <line x1="160" y1="135" x2="160" y2="225" stroke-width="12" stroke="#FFFFFF"/>
    
    <rect x="236" y="150" width="40" height="60" rx="6" fill="#FFFFFF" stroke="none"/>
    <line x1="256" y1="135" x2="256" y2="225" stroke-width="12" stroke="#FFFFFF"/>
    
    <rect x="332" y="150" width="40" height="60" rx="6" fill="#FFFFFF" stroke="none"/>
    <line x1="352" y1="135" x2="352" y2="225" stroke-width="12" stroke="#FFFFFF"/>
    
    <!-- Vertical Root Marker -->
    <path d="M160 260 L160 310 M160 310 L185 310" stroke-width="16"/>
  </g>
</svg>