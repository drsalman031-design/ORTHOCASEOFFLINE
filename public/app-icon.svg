<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="orthoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#149EAA" />
      <stop offset="50%" stop-color="#0E8292" />
      <stop offset="100%" stop-color="#085B68" />
    </linearGradient>
    <pattern id="gridLines" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.22" />
    </pattern>
    <filter id="toothGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#043138" flood-opacity="0.35" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0c4a55" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle App Icon Container -->
  <g filter="url(#cardShadow)">
    <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#orthoGrad)" />
    <!-- Grid Overlay -->
    <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#gridLines)" />
    <!-- Inner Border Highlight -->
    <rect x="24" y="24" width="464" height="464" rx="120" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />
  </g>

  <!-- Orthodontic Tooth Graphic -->
  <g filter="url(#toothGlow)" transform="translate(0, 0)">
    <!-- Main Tooth Outline (Smooth Occlusal Anatomy & Two Roots) -->
    <path
      d="M 160 145 
         C 180 125, 220 120, 256 142 
         C 292 120, 332 125, 352 145 
         C 382 175, 388 235, 375 300 
         C 362 360, 340 415, 316 415 
         C 295 415, 280 345, 256 260 
         C 232 345, 217 415, 196 415 
         C 172 415, 150 360, 137 300 
         C 124 235, 130 175, 160 145 Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Occlusal Fissure / Anatomy Crease -->
    <path
      d="M 226 155 C 242 165, 270 165, 286 155"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="8"
      stroke-linecap="round"
      stroke-opacity="0.8"
    />

    <!-- Main Archwire (Horizontal) -->
    <path
      d="M 162 205 L 350 205"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="12"
      stroke-linecap="round"
    />

    <!-- Left Bracket -->
    <rect x="180" y="185" width="28" height="40" rx="5" fill="#FFFFFF" />
    <line x1="194" y1="172" x2="194" y2="238" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />

    <!-- Center Bracket -->
    <rect x="242" y="185" width="28" height="40" rx="5" fill="#FFFFFF" />
    <line x1="256" y1="172" x2="256" y2="238" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />

    <!-- Right Bracket -->
    <rect x="304" y="185" width="28" height="40" rx="5" fill="#FFFFFF" />
    <line x1="318" y1="172" x2="318" y2="238" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />

    <!-- Auxiliary Attachment / Molar Tube Detail (Left Root) -->
    <path
      d="M 172 265 L 172 300 M 172 282 L 194 282"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Apical Marker Dot / Traction Detail -->
    <circle cx="236" cy="380" r="7" fill="#FFFFFF" />
  </g>
</svg>